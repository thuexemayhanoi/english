name: Apply Batch 8 docs
on:
  push:
    branches: [main]
    paths: ['docs/matrix/batch-8-rows.csv', '.github/workflows/apply-batch8-docs.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/tmp-apply-batch8.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Batch 8: sync state docs — master-matrix 392->442 rows, batch-8 status, MASTER-MATRIX counts, README state" || echo "nothing to commit"
          git push
