name: Apply Batch 7 docs
on:
  push:
    branches: [main]
    paths: ['docs/matrix/batch-7-rows.csv']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tmp-apply-batch7.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Batch 7: sync state docs — master-matrix 342->392 rows, batch-7 status, MASTER-MATRIX counts, README state"
          git push
