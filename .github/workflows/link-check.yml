name: Link Check (Lychee)

# Independent link checking with Lychee. No schedule: push/PR/dispatch only.
# - INTERNAL links: checked against the locally built site (offline, --root-dir
#   maps root-relative links against the built custom-domain tree); failures are
#   deterministic and BLOCKING (they mirror the rendered-site audit rules).
# - EXTERNAL links: 404/410 are treated as confirmed dead links and BLOCK.
#   403/429/timeouts/network failures remain report-only because many external
#   sites block CI bots. No external failure may trigger an automatic article
#   rewrite; reports are uploaded for review.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: link-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site with Jekyll (GitHub Pages toolchain)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Lychee — internal links (blocking, deterministic, offline)
        uses: lycheeverse/lychee-action@v2
        with:
          # NOTE: never put --output/--format in args — the action's own inputs
          # own those flags (entrypoint errors out if both are present).
          output: reports/lychee-internal.json
          format: json
          jobSummary: false
          fail: true
          args: >-
            --no-progress
            --offline
            --include-fragments
            --max-retries 1
            --timeout 10
            --root-dir "$PWD/_site"
            "$PWD/_site"
      - name: Extract external URLs (source articles + pages)
        run: |
          node -e '
          const fs=require("fs"),path=require("path");
          const L=require("./scripts/lib");
          const urls=new Set();
          for (const a of L.loadArticles()) for (const m of a.raw.matchAll(/https?:\/\/[^\s)"<>]+/g)) urls.add(m[0].replace(/[.,;]+$/,""));
          for (const p of L.loadPages()) for (const m of p.raw.matchAll(/https?:\/\/[^\s)"<>]+/g)) urls.add(m[0].replace(/[.,;]+$/,""));
          fs.writeFileSync("external-urls.txt",[...urls].sort().join("\n"));
          console.log("external URLs:",urls.size);
          '
      - name: Lychee — external links (report-only, tolerant of flaky sites)
        id: external
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          output: reports/lychee-external.json
          format: json
          jobSummary: false
          fail: true
          args: >-
            --no-progress
            --max-retries 2
            --retry-wait-time 10
            --timeout 20
            --exclude '^(https://www.linkedin.com|https://twitter.com|x.com)'
            external-urls.txt
      - name: Block confirmed dead external links (404/410 only)
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'reports/lychee-external.json';
          if (!fs.existsSync(p)) {
            console.error('Missing Lychee external report: ' + p);
            process.exit(1);
          }
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const groups = Object.values(data.error_map || {});
          const errors = groups.flatMap(v => Array.isArray(v) ? v : []);
          const dead = errors.filter(e => e && e.status && (e.status.code === 404 || e.status.code === 410));
          if (dead.length) {
            console.error('Confirmed dead external links (404/410): ' + dead.length);
            for (const e of dead) console.error('  ' + e.status.code + ' ' + e.url);
            process.exit(1);
          }
          console.log('No confirmed 404/410 external links. Other external failures remain report-only.');
          NODE
      - name: Note transient/external-bot failures (report-only)
        if: steps.external.outcome == 'failure'
        run: |
          echo "External checker reported non-404 failures too — inspect the artifact. 403/429/timeouts/network errors remain report-only and never trigger automatic article rewrites."
      - name: Upload link reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-reports
          path: reports/lychee-*.json
          retention-days: 30
