name: Apply Batch 10 docs

on:
  push:
    branches: [main]
    paths: ['docs/matrix/batch-10-rows.csv']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge batch-10 rows into master-matrix.csv and update README
        run: |
          set -e
          node -e '
          const fs = require("fs");
          const rows = fs.readFileSync("docs/matrix/batch-10-rows.csv", "utf8");
          let csv = fs.readFileSync("docs/matrix/master-matrix.csv", "utf8");
          let added = 0;
          if (!csv.includes("MM-0392,")) {
            const incoming = rows.split(/\r?\n/).filter(l => /^MM-04/.test(l));
            csv = csv.replace(/\r?\n?$/, "\r\n") + incoming.join("\r\n") + "\r\n";
            added = incoming.length;
            fs.writeFileSync("docs/matrix/master-matrix.csv", csv);
          }
          let rm = fs.readFileSync("README.md", "utf8");
          const before = rm;
          rm = rm.replace("- 457 published articles:", "- 482 published articles:");
          const entry = "- 2026-09-23: Batch 10 — cluster 3 scooter reviews Part 1. Published 25 articles (MM-0392–MM-0416): 7 manufacturer-verified model reviews (Honda Vision, Honda Air Blade 125/160, Honda Lead, Yamaha Janus, FreeGo, Grande), 6 model comparisons, 4 choosing guides and 8 verified-data spec explainers. All technical facts from official Honda VN / Yamaha VN model pages (recorded in docs/MODEL-DATABASE.md, retrieved 2026-09-23); business facts exclusively from OWNER-FACTS; no invented specs, prices or availability. Quality Gate PASS on final batch commit 821eeb9 (intermediate part-commit gates failed transiently on forward internal-link references, resolved within the batch; 2 broken slugs repaired). Pages deployment verified live; scooters hub shows the 25-guide count. master-matrix.csv +" + added + " rows via this apply-batch-10-docs sync. See docs/matrix/batch-10-status.md. 482 published articles site-wide; cluster 3: 25 of 110 intents (Part 2 next).\n";
          if (!rm.includes("Batch 10 — cluster 3 scooter reviews Part 1")) rm = rm.replace(/\n?$/, "\n") + entry;
          fs.writeFileSync("README.md", rm);
          console.log("README changed:", rm !== before, "| csv rows added:", added);
          '
      - name: Commit and clean up
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/matrix/master-matrix.csv README.md
          git rm .github/workflows/apply-batch-10-docs.yml
          git commit -m "Batch 10: sync state docs — master-matrix 457->482 rows, README state" || echo "nothing to commit"
          git push
