name: Docs Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/sync/**']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply batch docs sync
        id: apply
        continue-on-error: true
        run: node scripts/apply-batch-23-docs.js
      - name: Commit and push if changed
        if: steps.apply.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/MASTER-MATRIX.md docs/matrix/master-matrix.csv docs/matrix/batch-23-status.md docs/sync/batch-23-docs-sync.json sync-debug.txt
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Docs sync: batch-23 finalization (README state + master-matrix.csv merge 884->913)"
            git push
          fi
      - name: Publish sync diagnostics on failure
        if: steps.apply.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync-debug.txt
          if git diff --cached --quiet; then
            echo "No diagnostics produced."
          else
            git commit -m "Docs sync diagnostics (batch-23 validation failure)"
            git push
          fi
