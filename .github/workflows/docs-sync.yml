name: Docs Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/sync/**']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply batch-24 final docs updates
        id: apply
        continue-on-error: true
        run: node scripts/apply-batch-24-final-docs.js
      - name: Commit and push if changed
        if: steps.apply.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/MASTER-MATRIX.md
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Batch 24 final docs: README + MASTER-MATRIX state (913 -> 936, cluster 13 in progress)"
            git push
          fi
      - name: Publish sync diagnostics on failure
        if: steps.apply.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A || true
          git commit -m "Batch 24 final docs diagnostics (validation failure)" || echo "no diagnostics to commit"
          git push || echo "nothing to push"
