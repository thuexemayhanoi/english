name: Docs Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/sync/**']

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply batch-26 docs updates (idempotent)
        id: apply
        continue-on-error: true
        run: node scripts/apply-batch-26-docs.js
      - name: Record batch-26 verification (latest workflow runs)
        id: record
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/record-batch-26-verification.js
      - name: Commit and push if changed
        if: steps.apply.outcome == 'success' && steps.record.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/MASTER-MATRIX.md docs/matrix/master-matrix.csv docs/matrix/batch-26-status.md docs/sync/batch-26-final-verification.md
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Batch 26 docs-sync: merge + verification record (latest workflow runs)"
            git push
          fi
      - name: Publish sync diagnostics on failure
        if: steps.apply.outcome == 'failure' || steps.record.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A || true
          git commit -m "Batch 26 docs-sync diagnostics (validation failure)" || echo "no diagnostics to commit"
          git push || echo "nothing to push"
