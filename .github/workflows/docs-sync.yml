name: Docs Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/sync/**']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply batch docs sync
        run: node scripts/apply-batch-docs.js docs/sync/batch-13b-readme-sync.json
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/matrix/master-matrix.csv
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Docs sync: apply README deployment-state update (batch 13 verification)"
            git push
          fi
