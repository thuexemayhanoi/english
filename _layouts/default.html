<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'auto';
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>
<body>
  {% include header.html %}
  <main class="container">
    {{ content }}
  </main>
  {% include footer.html %}
  <nav class="mobile-nav" aria-label="Mobile navigation">
    <ul>
      <li><a href="{{ '/' | relative_url }}" data-nav="home">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>
        Home</a></li>
      <li><a href="{{ '/articles/' | relative_url }}" data-nav="guides">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M4 5h10v2H4V5zm0 4h16v2H4V9zm0 4h10v2H4v-2zm0 4h16v2H4v-2z"/></svg>
        Guides</a></li>
      <li><a href="{{ '/search/' | relative_url }}" data-nav="search">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
        Search</a></li>
      <li><a href="{{ '/about/' | relative_url }}" data-nav="contact">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M6.6 2 4 4.6c0 8.5 6.9 15.4 15.4 15.4L22 17.4l-4.2-2.1-2.4 2.4c-2.9-1.2-5.9-4.2-7.1-7.1L10.7 8 6.6 2z"/></svg>
        Contact</a></li>
    </ul>
  </nav>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
